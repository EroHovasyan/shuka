[build]
  command = "npm run build"
  publish = "dist"

# Replace with your Render service hostname for Netlify's proxy:
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RENDER-SERVICE.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
